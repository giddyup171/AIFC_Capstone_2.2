# Install once:  pip install pre-commit && pre-commit install
# Then ruff, mypy and the tests run automatically on every `git commit`.
# Run on everything manually:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=6000]     # the executed EDA notebook is ~4 MB

  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy (feature-engineering layer)
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        types: [python]
